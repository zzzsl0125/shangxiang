# .github/workflows/main.yml

name: 尚香书苑自动签到

on:
  # 允许在 Actions 页面手动触发，并可选择只体检 / 只识别验证码
  workflow_dispatch:
    inputs:
      mode:
        description: 'run=正常签到；diagnose=只体检；dry-run=只识别验证码不提交'
        required: true
        default: run
        type: choice
        options:
          - run
          - diagnose
          - dry-run

  # 定时任务（UTC），20:05 UTC = 北京时间次日 04:05
  schedule:
    - cron: '5 20 * * *'

# 只读权限即可，脚本不需要写仓库
permissions:
  contents: read

# 防止定时任务和手动触发叠在一起跑
concurrency:
  group: sxsy-checkin
  cancel-in-progress: false

jobs:
  check-in-job:
    runs-on: ubuntu-latest
    # 你的仓库里有一个名为 SXSY 的 Environment，Secrets 很可能是建在那里面。
    # job 不声明 environment 时读不到 Environment secrets，所以这里显式指定。
    # 如果以后把 Secrets 移到 Repository secrets，可以删掉这一行。
    environment: SXSY
    timeout-minutes: 15

    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查 Secrets
        env:
          SXSY_SECRET: ${{ secrets.SXSY }}
          OCR_SECRET: ${{ secrets.DDDD_OCR_URL }}
        run: |
          if [ -z "$SXSY_SECRET" ]; then
            echo "::error::没有配置 SXSY。请确认它建在 Repository secrets，或建在 Environment \"SXSY\" 里（本 workflow 已声明 environment: SXSY）；不要建在 Variables 里。"
            exit 1
          fi
          if [ -z "$OCR_SECRET" ]; then
            echo "::warning::没有配置 DDDD_OCR_URL。新版签到需要图形验证码，即使使用 Cookie 登录也会在签到环节失败。请确认它和 SXSY 建在同一处（Repository secrets 或 Environment \"SXSY\"）。"
          fi

      - name: 执行签到脚本
        env:
          # GitHub Secrets -> 环境变量
          sxsy: ${{ secrets.SXSY }}
          DDDD_OCR_URL: ${{ secrets.DDDD_OCR_URL }}
          DDDD_OCR_TOKEN: ${{ secrets.DDDD_OCR_TOKEN }}
          SXSY_HOST: ${{ secrets.SXSY_HOST }}
        run: |
          mode="${{ github.event.inputs.mode }}"
          case "$mode" in
            diagnose) python -u 尚香书苑.py --diagnose ;;
            dry-run)  python -u 尚香书苑.py --dry-run ;;
            *)        python -u 尚香书苑.py ;;
          esac
